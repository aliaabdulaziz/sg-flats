<g font-family="Arial, sans-serif" fill="#16324f">
<text x="24" y="32" font-size="21" font-weight="bold">MRT proximity and median price per square metre</text>
<text x="24" y="57" font-size="13">S$ per square metre · training period 2017–2024</text>
<text x="198" y="96" text-anchor="end" font-size="13">0–500 m</text>
