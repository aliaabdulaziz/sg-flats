<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="266" viewBox="0 0 1000 266" role="img" aria-labelledby="title desc">
<title id="title">MRT proximity and median price per square metre</title><desc id="desc">Unadjusted association; station-point straight-line distance, not walking distance.</desc>
